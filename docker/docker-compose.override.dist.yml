secrets:
  id_rsa:
    file: ~/.ssh/id_rsa
  id_rsa.pub:
    file: ~/.ssh/id_rsa.pub
  known_hosts:
    file: ~/.ssh/known_hosts

services:

  registro-domestico-web:
    ports:
      - "8081:80"

  registro-domestico-db:
    ports:
      - "3311:3306"

  registro-domestico-php:
    environment:
      COMPOSER_AUTH: >
        {"http-basic":{"dev.azure.com":{"username":"anything","password":"${AZURE_DEVOPS_TOKEN}"}}}
