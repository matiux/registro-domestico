volumes:
    registro-domestico-database-volume:
        name: registro-domestico-database-volume

networks:
    registro-domestico-network:
        name: registro-domestico-network
        driver: bridge

services:
    registro-domestico-php:
        image: registro-domestico-php
        build: php
        hostname: registro-domestico
        volumes:
            - ../:/var/www/app:delegated
            - ./data/shell_history:/home/ubuntu/shell_history
        networks:
            - registro-domestico-network
        environment:
            - HISTFILE=/home/ubuntu/shell_history/.x_history
        secrets:
            -   source: id_rsa
                target: /home/ubuntu/.ssh/id_rsa
            -   source: id_rsa.pub
                target: /home/ubuntu/.ssh/id_rsa.pub
            -   source: known_hosts
                target: /home/ubuntu/.ssh/known_hosts

    registro-domestico-web:
        image: nginx:1.22-alpine
        build: nginx
        depends_on:
            - registro-domestico-php
        volumes:
            - ./nginx/symfony.conf:/etc/nginx/conf.d/default.conf
            - ../:/var/www/app
            - ./logs/nginx/:/var/log/nginx
        networks:
            - registro-domestico-network

    conventional-commit-nodejs:
        image: conventional-commit-nodejs
        build: nodejs
        working_dir: /var/www/app
        volumes:
            - ../.git:/var/www/app/.git
        networks:
            - registro-domestico-network

    structurizr-lite:
        image: structurizr/lite:latest
        volumes:
            - ../docs:/usr/local/structurizr
        environment:
            - STRUCTURIZR_WORKSPACE_FILENAME=workspace
        restart: unless-stopped

    registro-domestico-db:
        image: mariadb:10.6
        volumes:
            - registro-domestico-database-volume:/var/lib/mysql
            - ./mariadb/custom.cnf:/etc/mysql/conf.d/custom.cnf
            - ./data/db:/docker-entrypoint-initdb.d
        environment:
            - MYSQL_ROOT_PASSWORD=root
            - MYSQL_DATABASE=gestore_pubblicazioni
        networks:
            - registro-domestico-network
